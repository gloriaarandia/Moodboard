<header class="navbar-header">
  <nav class="navbar-container">
    <a routerLink="/" class="logo">
      <div class="logo-icon">SF</div>
      <span class="logo-text">SoundFrame</span>
    </a>

    <div class="nav-actions">
      <button type="button" class="btn-sorprendeme" (click)="abrirModalSorprendeme()">
        <span>🎲</span>
        <span class="texto-oculto-movil">Sorpréndeme</span>
      </button>

      <a routerLink="/crear" class="btn-crear">
        <span class="plus">+</span>
        <span>Crear Moodboard</span>
      </a>

      <a routerLink="/perfil" class="btn-perfil" title="Mi Perfil">
        👤
      </a>
    </div>
  </nav>
</header>

@if (mostrarModalSorprendeme()) {
  <div class="modal-backdrop" (click)="cerrarModalSorprendeme()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" (click)="cerrarModalSorprendeme()">✕</button>
      <h2>¿Cómo te sientes hoy?</h2>
      <p>Elige una atmósfera y te llevamos directo a un moodboard con su música lista.</p>

      <div class="moods-grid">
        @for (estado of estadosAnimo; track estado.nombre) {
          <button
            type="button"
            class="mood-btn"
            [disabled]="cargandoSorprendeme()"
            (click)="elegirEstadoAnimo(estado.nombre)">
            <span>{{ estado.emoji }}</span>
            <span>{{ estado.nombre }}</span>
          </button>
        }
      </div>

      <button
        type="button"
        class="mood-cualquiera-btn"
        [disabled]="cargandoSorprendeme()"
        (click)="elegirEstadoAnimo()">
        ✨ Sorpréndeme con cualquier mood
      </button>

      @if (errorSorprendeme()) {
        <p class="modal-error">{{ errorSorprendeme() }}</p>
      }
    </div>
  </div>
}
